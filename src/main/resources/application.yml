server:
  port: 8088

spring:
  application:
    name: providers
  threads:
    virtual:
      enabled: true
  # Redis: итоги оплат у шлюзов (идемпотентность) — переживают рестарт, одни на все поды
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis недоступен — отказ за секунды (кэш идёт мимо, readiness — DOWN), а не ожидание по минуте
      connect-timeout: 1s
      timeout: 2s
      repositories:
        enabled: false

providers:
  # Сколько хранить итог оплаты у шлюза (повтор и запрос статуса)
  results-ttl: 7d
  # «Поставщик думает» — задержка ответа шлюза
  think-min: 200ms
  think-max: 600ms
  # Долгие оплаты: подписка через партнёра — PENDING, итог на запрос статуса через delay
  async:
    providers: [chatgpt]
    delay: ${PROVIDERS_ASYNC_DELAY:30s}

# Общая библиотека libs/platform: даты начислений и счетов — по московскому времени
platform:
  # Swagger: описание API и коды ошибок в схеме Problem
  openapi:
    description: "Заглушки поставщиков: шлюзы оплаты, ГИС ГМП"
    error-codes: com.paymentsapp.providers.ProvidersError
  time:
    zone: Europe/Moscow

# Actuator: /actuator/health — liveness (процесс жив) и readiness (готов принимать запросы: есть БД и Redis);
# по ним healthcheck в compose и пробы Kubernetes. Остановка — плавная (по умолчанию в Spring Boot): новые запросы
# не принимаем, текущие дорабатывают
management:
  endpoints:
    web:
      exposure:
        # prometheus — метрики для Prometheus (/actuator/prometheus); куда отправлять трассы и формат логов
        # задаёт окружение (в Kubernetes — payments-deploy/envs/<окружение>/env.yaml)
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,redis

springdoc:
  # Swagger UI и спецификация включены; в проде можно выключить: SWAGGER_ENABLED=false
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
